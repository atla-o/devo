# Deploy Cloud Run service devo-web on push to main.
#
# Public access is invoker-iam-disabled (annotation already true on the live
# service). Never --allow-unauthenticated: org policy blocks allUsers.
# Do not pass --no-invoker-iam-check / --invoker-iam-check=disabled here;
# operator gcloud rejected --invoker-iam-check=disabled. Follow-up if needed:
# gcloud run services update devo-web --region=us-west1 --project=devo-holding \
#   --update-annotations=run.googleapis.com/invoker-iam-disabled=true
#
# One-time: Workload Identity Federation from this repo to a deploy SA, then
# repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT.
# See README.md.

name: Deploy devo-web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devo-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: devo-holding
  REGION: us-west1
  SERVICE: devo-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Host routing tests
        run: python3 test_host.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Check Workload Identity config
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SA" ]; then
            echo "Set repository variables GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT."
            echo "See README.md (Deploy)."
            exit 1
          fi

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy devo-web
        run: |
          gcloud run deploy "${SERVICE}" \
            --source=. \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --quiet
