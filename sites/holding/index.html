<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devo</title>
    <meta
      name="description"
      content="Devo — Arcada, Mattercircle, Humanehealth, Lightround."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/style.css?v=5" />
    <script>
      try {
        if (localStorage.getItem("devo-theme") === "rich") {
          document.documentElement.setAttribute("data-theme", "rich");
        }
      } catch (err) {}
    </script>
  </head>
  <body>
    <main class="page page--home theme-simple">
      <h1 class="mark mark--halo" aria-label="Devo">
        <button type="button" class="theme-switch" aria-pressed="false" aria-label="Switch theme">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>
      </h1>
      <ul class="directory">
        <li class="tile-row">
          <a class="tile" href="https://arcada.devoutshaman.com">
            <span class="tile-copy">
              <h2>Arcada</h2>
              <p class="tile-blurb">social club</p>
            </span>
            <svg class="halo halo--whole" viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </a>
        </li>
        <li class="tile-row">
          <a
            class="tile"
            href="https://mattercircle.devoutshaman.com"
            data-local="/mattercircle"
          >
            <span class="tile-copy">
              <h2>Mattercircle</h2>
              <p class="tile-blurb">material products</p>
            </span>
            <svg class="halo halo--whole" viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </a>
        </li>
        <li class="tile-row">
          <a
            class="tile"
            href="https://humanehealth.devoutshaman.com"
            data-local="/humanehealth"
          >
            <span class="tile-copy">
              <h2>Humanehealth</h2>
            </span>
            <svg class="halo halo--fractured" viewBox="0 0 32 32" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-linecap="butt">
                <path stroke-width="2.4" d="M9.2 8.4A9.2 9.2 0 0 1 20.6 6.8"/>
                <path stroke-width="2.4" d="M24.8 12.6A9.2 9.2 0 0 1 23.2 23.4"/>
                <path stroke-width="2.4" d="M16.8 27.2A9.2 9.2 0 0 1 7.4 16.2"/>
                <path stroke-width="1.3" d="M20.6 6.8 23.2 10.4 20.2 12.2"/>
                <path stroke-width="1.3" d="M23.2 23.4 18.6 25.2 16.8 27.2"/>
              </g>
            </svg>
          </a>
        </li>
        <li class="tile-row">
          <a
            class="tile"
            href="https://lightround.devoutshaman.com"
            data-local="/lightround"
          >
            <span class="tile-copy">
              <h2>Lightround</h2>
            </span>
            <svg class="halo halo--fractured" viewBox="0 0 32 32" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-linecap="butt">
                <path stroke-width="2.4" d="M9.2 8.4A9.2 9.2 0 0 1 20.6 6.8"/>
                <path stroke-width="2.4" d="M24.8 12.6A9.2 9.2 0 0 1 23.2 23.4"/>
                <path stroke-width="2.4" d="M16.8 27.2A9.2 9.2 0 0 1 7.4 16.2"/>
                <path stroke-width="1.3" d="M20.6 6.8 23.2 10.4 20.2 12.2"/>
                <path stroke-width="1.3" d="M23.2 23.4 18.6 25.2 16.8 27.2"/>
              </g>
            </svg>
          </a>
        </li>
      </ul>
      <p class="fineprint">devo</p>
    </main>
    <div class="theme-rich">
      <header class="topbar">
        <button type="button" class="theme-switch" aria-pressed="false" aria-label="Switch theme">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </button>
        <nav class="topnav" aria-label="Devo">
          <a href="https://arcada.devoutshaman.com">Arcada</a>
          <a href="https://mattercircle.devoutshaman.com" data-local="/mattercircle">Mattercircle</a>
          <a href="https://humanehealth.devoutshaman.com" data-local="/humanehealth">Humanehealth</a>
          <a href="https://lightround.devoutshaman.com" data-local="/lightround">Lightround</a>
        </nav>
      </header>
      <a class="panel" href="https://arcada.devoutshaman.com">
        <img src="/shared/panels/arcada.svg" alt="" />
        <span class="panel-copy"><strong>Arcada</strong><em>social club</em></span>
      </a>
      <a class="panel" href="https://mattercircle.devoutshaman.com" data-local="/mattercircle">
        <img src="/shared/panels/mattercircle.svg" alt="" />
        <span class="panel-copy"><strong>Mattercircle</strong><em>material products</em></span>
      </a>
      <a class="panel" href="https://humanehealth.devoutshaman.com" data-local="/humanehealth">
        <img src="/shared/panels/humanehealth.svg" alt="" />
        <span class="panel-copy"><strong>Humanehealth</strong></span>
      </a>
      <a class="panel" href="https://lightround.devoutshaman.com" data-local="/lightround">
        <img src="/shared/panels/lightround.svg" alt="" />
        <span class="panel-copy"><strong>Lightround</strong></span>
      </a>
    </div>
    <script src="/shared/preview.js"></script>
    <script src="/shared/theme.js"></script>
  </body>
</html>
