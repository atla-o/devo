<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>checkout</title>
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/style.css?v=64" />
    <script>
      try {
        var stored = localStorage.getItem("devo-theme");
        if (stored === "rich" || stored === "complex") {
          document.documentElement.setAttribute("data-theme", "complex");
        }
      } catch (err) {}
    </script>
  </head>
  <body>
    <main class="page page--store" data-checkout data-house="mattercircle">
      <h1 class="mark mark--halo" aria-label="Devo">
        <a href="/" aria-label="Home"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
      </h1>
      <h2 class="store-title">checkout</h2>
      <ul class="store-items" data-items></ul>
      <form class="store-pay" method="post" action="/offer">
        <input type="hidden" name="house" value="mattercircle" />
        <input type="hidden" name="offering" value="checkout" />
        <input type="hidden" name="next" value="/mattercircle/checkout" />
        <input type="hidden" name="action" value="buy" />
        <p>payment</p>
        <button type="submit" data-pay disabled>pay</button>
        <p>address</p>
        <input name="name" autocomplete="name" placeholder="name" aria-label="name" required />
        <input name="email" type="email" autocomplete="email" placeholder="email" aria-label="email" required />
        <input name="line1" autocomplete="address-line1" placeholder="street" aria-label="street" />
        <div class="store-address">
          <input name="city" autocomplete="address-level2" placeholder="city" aria-label="city" />
          <input name="region" autocomplete="address-level1" placeholder="region" aria-label="region" />
          <input name="postal" autocomplete="postal-code" placeholder="postal" aria-label="postal" />
        </div>
      </form>
      <footer class="support">
        <a href="https://donate.stripe.com/7sY00ifPd8Xdb278i24Ni00">Support Devo</a>
        <p>A gift to Atla LLC. Not tax deductible, not an investment.</p>
      </footer>
    <script src="/shared/store.js?v=1"></script>
    </main>
  </body>
</html>
