<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mattercircle</title>
    <meta name="theme-color" content="#F4F0E8" />
    <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/style.css?v=62" />
    <script>
      try {
        if (localStorage.getItem("devo-theme") === "rich") {
          document.documentElement.setAttribute("data-theme", "rich");
        }
      } catch (err) {}
    </script>
  </head>
  <body>

    <main class="page page--home theme-simple">
      <h1 class="mark mark--halo" aria-label="Devo"><button type="button" class="theme-switch" aria-pressed="false" aria-label="Switch theme"><span class="o-depth"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></button></h1>
      <div class="sheet">
        <section class="branch">
          <h2><a href="/">Mattercircle</a></h2>
                    <p class="blurb">non-petroleum factory</p>
          <p class="blurb">prefab housing</p>
          <h2>Products</h2>
          <ul>
              <li><a href="/mattercircle/climb/toiletries">toiletries</a></li>
              <li><a href="/mattercircle/climb/wearables">wearables</a></li>
              <li><a href="/mattercircle/climb/utility">utility</a></li>
              <li><a href="/mattercircle/climb/furniture">furniture</a></li>
          </ul>
          <h2>Services</h2>
          <ul>
              <li><a href="/mattercircle/checkout">checkout</a></li>
          </ul>
        </section>
      </div>
      
      <footer class="support">
        <a href="https://donate.stripe.com/7sY00ifPd8Xdb278i24Ni00">Support Devo</a>
        <p>A gift to Atla LLC. Not tax deductible, not an investment.</p>
      </footer>

    </main>
    <div class="theme-rich">
      
      <header class="topbar">
        <button type="button" class="theme-switch" aria-pressed="false" aria-label="Switch theme"><span class="o-depth"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></button>
        <nav class="topnav" aria-label="Devo">
          <div class="topitem"><a href="/humanehealth">Humanehealth</a></div>
          <div class="topitem"><a href="/utopiasocial">utopiasocial</a></div>
          <div class="topitem"><a href="/mattercircle">Mattercircle</a></div>
        </nav>
        <button type="button" class="menu-toggle" aria-expanded="false" aria-label="Menu"><span class="menu-word">Menu</span></button>
      </header>
      <div class="menu-sheet">
        <a href="/humanehealth">Humanehealth</a>
        <a href="/utopiasocial">utopiasocial</a>
        <a href="/mattercircle">Mattercircle</a>
      </div>

      <div class="offer-stage">
        
        <div class="mosaic mosaic--matter">
          <a class="shot cell--furniture" href="/mattercircle/climb/furniture"><img src="/shared/offerings/furniture.jpg" alt="" /></a>
          <a class="shot cell--wearables" href="/mattercircle/climb/wearables"><img src="/shared/offerings/wearables.jpg" alt="" /></a>
          <a class="shot cell--utility" href="/mattercircle/climb/utility"><img src="/shared/offerings/utility.jpg" alt="" /></a>
          <a class="shot cell--toiletries" href="/mattercircle/climb/toiletries"><img src="/shared/offerings/toiletries.jpg" alt="" /></a>
        </div>

      </div>
    </div>

    <script src="/shared/theme.js?v=33"></script>
  </body>
</html>
