<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mattercircle</title>
    <meta name="theme-color" content="#F4F0E8" />
    <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/shared/style.css?v=61" />
    <script>
      try {
        if (localStorage.getItem("devo-theme") === "rich") {
          document.documentElement.setAttribute("data-theme", "rich");
        }
      } catch (err) {}
    </script>
  </head>
  <body>
    <main class="page page--home theme-simple sheet-page">
      <h1 class="mark mark--halo" aria-label="Devo"><button type="button" class="theme-switch" aria-pressed="false" aria-label="Switch theme"><span class="o-depth"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></button></h1>
      <h2 class="offer-title">Mattercircle</h2>
      <p class="offer-line">non-petroleum factory</p>
      <p class="offer-line">prefab housing</p>
      <div class="door">
        <section>
          <h2>Products</h2>
          <ul>
            <li><a href="/climb/toiletries">toiletries</a></li>
            <li><a href="/climb/wearables">wearables</a></li>
            <li><a href="/climb/utility">utility</a></li>
            <li><a href="/climb/furniture">furniture</a></li>
          </ul>
        </section>
        <section>
          <h2>Services</h2>
          <ul>
            <li><a href="/checkout">checkout</a></li>
          </ul>
        </section>
      </div>
    </main>
    <div class="theme-rich offer-stage">
      <button type="button" class="theme-switch" aria-pressed="false" aria-label="Switch theme"><span class="o-depth"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span></button>
      
      <div class="mosaic mosaic--matter">
        <a class="shot cell--furniture" href="/climb/furniture"><img src="/shared/offerings/furniture.jpg" alt="" /></a>
        <a class="shot cell--wearables" href="/climb/wearables"><img src="/shared/offerings/wearables.jpg" alt="" /></a>
        <a class="shot cell--utility" href="/climb/utility"><img src="/shared/offerings/utility.jpg" alt="" /></a>
        <a class="shot cell--toiletries" href="/climb/toiletries"><img src="/shared/offerings/toiletries.jpg" alt="" /></a>
      </div>

    </div>
    <script src="/shared/offer.js"></script>
  </body>
</html>
