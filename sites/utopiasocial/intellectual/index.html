<!DOCTYPE html>

  <body>
    <main class="page page--home">
      <h1 class="mark mark--halo" aria-label="Devo"><a href="/" aria-label="Home"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a></h1>
      <div class="sheet">
        <section class="branch">
                    <h2>intellectual club</h2>
          <p class="blurb">Intellectual club is one text and one sitting.</p>
          <p class="blurb">The hour is reading and lecture, then speech in turn.</p>
          <p class="blurb">You are asking to sit with that text.</p>
          <form class="offer-form" method="post" action="/offer">
            <input type="hidden" name="house" value="utopiasocial" />
            <input type="hidden" name="offering" value="intellectual club" />
            <input type="hidden" name="next" value="/utopiasocial/intellectual" />
            <label>Name <input name="name" required autocomplete="name" /></label>
            <label>Email <input name="email" type="email" required autocomplete="email" /></label>
            <button type="submit" name="action" value="sit">Ask to sit</button>
          </form>
        </section>
      </div>
      <footer class="support">
        <a href="https://donate.stripe.com/7sY00ifPd8Xdb278i24Ni00">Support Devo</a>
        <p>A gift to Atla LLC. Not tax deductible, not an investment.</p>
      </footer>
